name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the page URL and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /shop
        2. Filter by …
        3. See error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Browser + OS, or PHP / Node versions for setup issues
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant lines from storage/logs/laravel.log or the browser console.
