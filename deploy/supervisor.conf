# Background workers on each app node (or a dedicated worker node).
# Mail is queued on "mail"; everything else on "default".

[program:zovita-queue]
command=php /var/www/zovita/artisan queue:work redis --queue=mail,default --sleep=1 --tries=3 --backoff=10 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/zovita/storage/logs/queue.log
stopwaitsecs=3600

# Run the scheduler on exactly ONE node: prescriptions:auto-approve (10 min), payments:expire (5 min),
# refills:remind (daily 09:00 PKT).
[program:zovita-schedule]
command=php /var/www/zovita/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/zovita/storage/logs/schedule.log

# Inertia server-side rendering (node bootstrap/ssr/ssr.js) on every app node; Laravel falls back to
# client rendering if it is down.
[program:zovita-ssr]
command=php /var/www/zovita/artisan inertia:start-ssr
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/zovita/storage/logs/ssr.log
