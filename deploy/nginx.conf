# Zovita+ — production edge for zovita.ahmershah.dev
#
# Topology:   clients → (optional CDN/Cloudflare) → this nginx (TLS, rate limits, static, LB)
#                                                   ↘ app1:9000, app2:9000, … (php-fpm, stateless)
#             shared: MySQL (primary + read replica), Redis (cache, sessions, queues, locks),
#                     object storage or NFS for storage/app (prescriptions, product images)
#
# The Laravel app is stateless (sessions/cache/queue in Redis), so app servers can be added or
# removed freely. Stock and checkout correctness rely on row locks in MySQL, not on any one node.

# ── Rate limiting (before PHP is ever reached) ────────────────────────────────────────────────
# Per-IP request budgets. The app adds its own per-route and per-account limits on top.
limit_req_zone  $binary_remote_addr zone=zv_pages:20m   rate=10r/s;
# Writes only: GET/HEAD/OPTIONS map to an empty key, and empty keys are never limited.
map $request_method $zv_write_key { default $binary_remote_addr; GET ""; HEAD ""; OPTIONS ""; }
limit_req_zone  $zv_write_key       zone=zv_writes:20m  rate=2r/s;
limit_req_zone  $binary_remote_addr zone=zv_auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=zv_conn:10m;

# ── Upstream pool (load balancing) ────────────────────────────────────────────────────────────
upstream zovita_php {
    least_conn;                          # send work to the least busy node
    server app1.internal:9000 max_fails=3 fail_timeout=15s;
    server app2.internal:9000 max_fails=3 fail_timeout=15s;
    # server app3.internal:9000 max_fails=3 fail_timeout=15s;   # scale out by adding lines
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name zovita.ahmershah.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zovita.ahmershah.dev;

    ssl_certificate     /etc/letsencrypt/live/zovita.ahmershah.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zovita.ahmershah.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_stapling on;

    root /var/www/zovita/public;
    index index.php;
    charset utf-8;

    # ── Slow-loris / oversized-request protection ──
    client_max_body_size      12m;     # biggest legitimate upload is a 5 MB prescription
    client_body_timeout       15s;
    client_header_timeout     15s;
    keepalive_timeout         20s;
    send_timeout              20s;
    large_client_header_buffers 4 8k;
    limit_conn zv_conn 40;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # ── Static assets: immutable, compressed, never touch PHP ──
    location /build/ {
        gzip_static on;
        brotli_static on;                # requires ngx_brotli; Vite already emits .br/.gz
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* ^/(storage|images|models)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ── Tighter budgets for sign-in, sign-up, password reset and checkout ──
    location ~ ^/(login|register|forgot-password|reset-password|checkout) {
        limit_req zone=zv_auth burst=10 nodelay;
        limit_req zone=zv_pages burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=zv_pages burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        limit_req zone=zv_writes burst=10 nodelay;   # POST/PUT/PATCH/DELETE only (see map above)
        limit_req_status 429;

        fastcgi_pass zovita_php;
        fastcgi_keep_conn on;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles, env files or backups.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|sql|bak|ini)$ { deny all; }
}
